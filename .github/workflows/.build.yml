name: Build Kotlin Converter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0

      - name: Build
        run: bazel build //convert:convert

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-converter-binary
          path: bazel-bin/convert/
